name: Release & Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@hwm-1114'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Build renderer
        run: node scripts/build.js
      - name: Package installer & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node node_modules/electron-builder/cli.js --win nsis --publish always
      - name: Publish npm package to GitHub Packages
        if: always()
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
      - name: Merge release drafts & publish
        # electron-builder 偶发把资产拆进两个 draft（v0.1.46 起连续 5 版）：
        # 合并资产 → 转正发布 → 清理残缺草稿。单草稿时等效自动 publish。
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fix-release-drafts.js

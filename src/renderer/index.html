<!DOCTYPE html>
<html lang="zh-CN" data-theme="markhunter-classic">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; script-src 'self'; object-src 'self' file: data:; base-uri 'none'" />
  <title>MarkHunter</title>
  <link rel="stylesheet" href="dist/tailwind.css" />
  <!-- v0.6.0：KaTeX 数学公式样式（构建时从 node_modules/katex 拷贝到 dist/katex.css，
       其引用的字体在 dist/fonts/ 下，与 CSP 的 default-src 'self' 同源兼容） -->
  <link rel="stylesheet" href="dist/katex.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 特效皮肤背景层：默认隐藏，仅 fx-* 主题显示；pointer-events:none 不拦截任何交互 -->
  <div id="fx-layer" aria-hidden="true"></div>
  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <div class="brand">
      <span class="brand-mark">M↓</span>
      <div class="brand-text">
        <span class="brand-name">MarkHunter</span>
        <span class="brand-slogan">执笔即江湖，所写皆锋芒</span>
      </div>
    </div>
    <div class="toolbar-group">
      <button id="btn-open-dir" class="tbtn" title="选择本地目录 (Ctrl+O)">📂 选择目录</button>
      <button id="btn-toggle-fav" class="tbtn" title="收藏当前工作目录" disabled>☆ 收藏</button>
      <!-- 右侧收藏栏开合入口（pin 态下点击 = 取消 pin 并关闭，语义恒为「切换收藏栏」）；
           ☆ 收藏按钮保持「收藏/取消当前目录」语义不动（smoke fav* 用例断言它的星标行为） -->
      <button id="btn-fav-rail" class="tbtn" title="显示 / 隐藏右侧收藏栏">🗂 收藏栏</button>
      <span id="dir-label" class="dir-label" title="">未打开目录</span>
    </div>
    <div class="toolbar-group">
      <button id="btn-global-search" class="tbtn" title="全局搜索（Ctrl+Shift+F）">🔍 搜索</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-preview-mode" class="tbtn" title="切换预览模式">👁 预览</button>
      <button id="btn-diff" class="tbtn" title="对比：当前文档 ↔ 其它标签 / 剪贴板 / 磁盘版本">🔀 对比</button>
      <button id="btn-run-py" class="tbtn accent" title="运行当前脚本（.py / .bat / .cmd）">▶ 运行</button>
      <button id="btn-settings" class="tbtn" title="设置">⚙ 设置</button>
    </div>
  </header>

  <!-- 主体：左树 + 右编辑区 -->
  <main id="main">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>文件</span>
      </div>
      <div class="sidebar-actions">
        <button id="btn-new-file" class="tbtn" title="新建文件">📝 新建文件</button>
        <button id="btn-new-dir" class="tbtn" title="新建目录">📁 新建目录</button>
        <button id="btn-refresh" class="tbtn" title="刷新目录树">🔄 刷新</button>
      </div>
      <!-- 收藏目录分区已整体搬入右侧收藏栏 #fav-rail（见 #workbench 之后；所有 ID 原样保留，
           favorites.js 与 fav* 冒烟用例按 ID 取值零改动），左栏剩 文件树 / 全局搜索 两分区 -->
      <!-- 0.5.0 Phase 5a E2：树分区标题行（可折叠 + 记忆；折叠只加 #file-tree.collapsed，
           不动树内部任何渲染/展开态逻辑 —— J4 的展开态恢复不受影响） -->
      <div id="tree-header" class="sect-header" data-sect="tree" title="点击折叠/展开">
        <span class="sect-caret" id="tree-caret">▼</span>
        <span>📂 文件树</span>
      </div>
      <div id="file-tree" class="file-tree">
        <div class="tree-empty">点击「选择目录」打开一个本地文件夹</div>
      </div>
      <!-- 0.5.0 Phase 5a B1：大纲 / TOC 分区（非 Markdown / 大文件查看器视图整体隐藏，见 outline.js） -->
      <div id="outline-block" class="outline-block collapsed hidden">
        <div id="outline-header" class="sect-header" data-sect="outline" title="点击折叠/展开">
          <span class="sect-caret" id="outline-caret">▼</span>
          <span id="outline-title">🧭 大纲</span>
        </div>
        <div id="outline-list" class="outline-list"></div>
      </div>
      <div id="tree-search-divider" class="resize-divider h"></div>
      <!-- 全局搜索（左侧栏展示） -->
      <div id="sidebar-search">
        <div id="search-header" class="sect-header" data-sect="search" title="点击折叠/展开">
          <span class="sect-caret" id="search-caret">▼</span>
          <span>🔍 全局搜索</span>
        </div>
        <div class="gs-bar">
          <input id="gs-input" type="text" placeholder="全局搜索（Ctrl+Shift+F）…" />
          <button id="btn-gs-go" class="tbtn">搜索</button>
        </div>
        <div class="gs-bar gs-replace-bar">
          <input id="gs-replace-input" type="text" placeholder="替换为…（对结果文件的全部匹配）" />
          <button id="btn-gs-replace-all" class="tbtn small danger" title="在当前搜索结果涉及的文件中批量替换">全部替换</button>
        </div>
        <div id="gs-results" class="gs-results"></div>
        <div class="gs-count-row"><span id="gs-count" class="find-count"></span></div>
      </div>
    </aside>

    <div id="sidebar-divider" class="resize-divider v"></div>

    <section id="workbench">
      <!-- 0.5.0 多视图 Phase 2：编辑区改为「栏容器」，各栏（.pane）由 tabs.js 的 buildPaneDom 模板生成。
           · p0 沿用历史 ID（#tabs / #editor-host / #image-host / #diff-host /
             #split-divider / #preview-host / #preview-content / #zoom-badge / #editor-empty）——
             find.js / preview.js / globalsearch.js / 冒烟里所有按 ID 取值的地方零改动；
             （#viewer-bar 已随大文件悬浮操作条在 v0.9.0 删除）
           · p1（Ctrl+\ 或拖标签到编辑区边缘时创建）只用 class 定位，DOM 与 p0 完全对称；
           · 两栏之间的 .pane-divider 也由 tabs.js 动态插入（回到单栏时移除）。 -->
      <div id="editor-panes" class="editor-panes"></div>
    </section>

    <!-- 右侧收藏栏分隔条（仅 pin 挤压式常驻时可见；reverse 拖拽 = 向左拖加宽，宽度落盘 favRailWidth） -->
    <div id="favrail-divider" class="resize-divider v hidden"></div>
    <!-- 右侧收藏栏：可隐藏 / 可 pin 常显（状态机与样式见 styles.css「右侧收藏栏」节、app.js applyFavRail）。
         #fav-block 从左侧栏**原样搬入**（#fav-block/#fav-header/#fav-caret/#fav-list 全部 ID 不变）：
         favorites.js 与冒烟 favAdd/favOpen/favRemove/favPersist/sidebarCollapse 按 ID 断言零改动。 -->
    <aside id="fav-rail" class="hidden">
      <div class="favrail-header">
        <span class="favrail-title">🗂 收藏栏</span>
        <button id="btn-fav-pin" class="tbtn small" title="固定为常驻栏（挤压布局）">📌</button>
        <button id="btn-favrail-close" class="tbtn small" title="关闭收藏栏（Esc）">✕</button>
      </div>
      <div id="fav-block" class="fav-block">
        <div id="fav-header" class="fav-header" title="点击折叠/展开">
          <span class="fav-caret" id="fav-caret">▶</span>
          <span>📌 收藏目录</span>
        </div>
        <div id="fav-list" class="fav-list"></div>
      </div>
    </aside>

  </main>

  <!-- 底部面板 -->
  <div id="bottom-divider" class="resize-divider h"></div>
  <footer id="bottom-panel">
    <div class="panel-tabs">
      <button class="ptab" data-panel="find">文件内搜索</button>
      <button class="ptab" data-panel="python">运行（Python / 批处理）</button>
      <div class="panel-actions">
        <span id="save-status" class="save-status"></span>
        <button id="btn-max-panel" class="tbtn small" title="最大化 / 还原面板">⛶</button>
        <button id="btn-close-panel" class="tbtn small" title="收起面板（Esc）">✕</button>
      </div>
    </div>

    <!-- 文件内查找与替换 -->
    <div class="panel-body" id="panel-find">
      <div class="find-bar">
        <span class="find-label">查找</span>
        <input id="find-input" type="text" placeholder="在当前文件中查找（默认不区分大小写，Enter 下一处）…" />
        <!-- 0.5.0 Phase 5a G1：三个匹配开关（默认全关 = 旧口径）。状态由 find.js 统一维护 -->
        <button id="find-case" class="tbtn small find-toggle" type="button" title="Aa 区分大小写" aria-pressed="false">Aa</button>
        <button id="find-word" class="tbtn small find-toggle" type="button" title="整词匹配（前后不得是字母/数字/下划线）" aria-pressed="false">整词</button>
        <button id="find-regex" class="tbtn small find-toggle" type="button" title="正则表达式（模式 ≤ 200 字符；含嵌套量词的模式会被拒绝）" aria-pressed="false">.*</button>
        <span id="find-count" class="find-count"></span>
      </div>
      <div class="find-bar">
        <span class="find-label">替换</span>
        <input id="replace-input" type="text" placeholder="替换为…（留空 = 删除匹配内容）" />
        <button id="btn-replace" class="tbtn small" title="替换当前选中处（Enter）">替换</button>
        <button id="btn-replace-all" class="tbtn small" title="替换当前文件中全部匹配">全部替换</button>
      </div>
      <div id="find-results" class="find-results"></div>
    </div>

    <!-- Python 输出 -->
    <div class="panel-body hidden" id="panel-python">
      <div class="python-bar">
        <span id="py-status" class="py-status">未运行</span>
        <button id="btn-py-kill" class="tbtn small danger">■ 终止</button>
        <button id="btn-py-clear" class="tbtn small">清空</button>
      </div>
      <pre id="py-output" class="py-output"></pre>
    </div>
  </footer>

  <!-- 状态栏：当前文件位置 / 字数 -->
  <div id="status-bar">
    <span id="sb-file">未打开文件</span>
    <span class="sb-spacer"></span>
    <span id="sb-pos"></span>
    <span id="sb-len"></span>
    <!-- 崩溃恢复入口（0.5.0 挂账收尾）：有未保存的大文件编辑时可见，点开是 DOM 弹窗，默认隐藏 -->
    <button id="sb-recover" class="sb-btn hidden" title="恢复未保存的大文件编辑"></button>
    <button id="btn-scroll-top" class="sb-btn" title="回到顶部">↑ 顶部</button>
    <button id="btn-scroll-bottom" class="sb-btn" title="跳到底部">↓ 底部</button>
  </div>

  <!-- 弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div class="modal" id="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="ctx-menu" class="ctx-menu hidden"></div>

  <script src="dist/bundle.js"></script>
</body>
</html>
